name: CI/CD

on:
  workflow_dispatch:
    inputs:
      # 手动运行模式选择
      run_mode:
        description: '运行模式'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

      # 手动发布版本号（仅生产模式需要）
      manual_version:
        description: '手动指定版本号 (如: 1.2.3，仅生产模式有效)'
        required: false
        type: string

      # 发布说明
      release_notes:
        description: '发布说明 (可选)'
        required: false
        type: string

      # 是否强制发布到 NPM
      force_npm_publish:
        description: '强制发布到 NPM (仅生产模式)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

env:
  APP_NAME: karin-plugin-qbot

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  # 版本发布管理
  version-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created || steps.manual-release.outputs.releases_created }}
      release_created: ${{ steps.release-please.outputs.release_created || steps.manual-release.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name || steps.manual-release.outputs.tag_name }}
      core_version: ${{ steps.get-version-info.outputs.core_version }}
      should_upload_release: ${{ steps.get-version-info.outputs.should_upload_release }}
      release_tag_name: ${{ steps.get-version-info.outputs.release_tag_name }}
      is_manual_production: ${{ steps.get-version-info.outputs.is_manual_production }}
      manual_release_notes: ${{ steps.get-version-info.outputs.manual_release_notes }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # 自动版本发布检查（非手动生产模式）
      - name: 🚀 执行版本发布检查
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # 手动生产发布处理
      - name: 🎯 处理手动生产发布
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production'
        id: manual-release
        run: |
          if [ -z "${{ inputs.manual_version }}" ]; then
            echo "❌ 生产模式必须指定版本号" >&2
            exit 1
          fi

          # 验证版本号格式
          if ! echo "${{ inputs.manual_version }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ 版本号格式错误，应为 x.y.z 格式" >&2
            exit 1
          fi

          echo "releases_created=true" >> $GITHUB_OUTPUT
          echo "release_created=true" >> $GITHUB_OUTPUT
          echo "tag_name=v${{ inputs.manual_version }}" >> $GITHUB_OUTPUT

          echo "✅ 手动生产发布已配置：v${{ inputs.manual_version }}"

      - name: 🏷️ 获取版本信息
        id: get-version-info
        run: |
          # 处理手动生产模式
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "production" ]; then
            # 手动更新 package.json 版本号
            npm version ${{ inputs.manual_version }} --no-git-tag-version
            CORE_VERSION="${{ inputs.manual_version }}"
            echo "should_upload_release=true" >> $GITHUB_OUTPUT
            echo "release_tag_name=v${{ inputs.manual_version }}" >> $GITHUB_OUTPUT
            echo "is_manual_production=true" >> $GITHUB_OUTPUT
            echo "manual_release_notes=${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "🎯 手动生产模式：版本 $CORE_VERSION"
          else
            # 自动模式或预览模式
            CORE_VERSION=$(node -p "require('./package.json').version")
            echo "is_manual_production=false" >> $GITHUB_OUTPUT
            echo "manual_release_notes=" >> $GITHUB_OUTPUT

            if [ "${{ steps.release-please.outputs.release_created }}" = "true" ] || [ "${{ inputs.force_npm_publish }}" = "true" ]; then
              echo "should_upload_release=true" >> $GITHUB_OUTPUT
              echo "release_tag_name=${{ steps.release-please.outputs.tag_name }}" >> $GITHUB_OUTPUT
            else
              echo "should_upload_release=false" >> $GITHUB_OUTPUT
              echo "release_tag_name=" >> $GITHUB_OUTPUT
            fi
          fi

          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "📦 当前版本：$CORE_VERSION"

  # 统一构建作业
  unified-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version-release]
    outputs:
      build_success: ${{ steps.build-status.outputs.success }}
      package_name: ${{ steps.package-info.outputs.name }}
      package_short_name: ${{ steps.package-info.outputs.short_name }}
      commit_hash: ${{ steps.git-info.outputs.commit_hash }}
      short_commit_hash: ${{ steps.git-info.outputs.short_commit_hash }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 📦 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 🔨 执行完整项目构建
        run: |
          echo "开始构建..."
          pnpm build
          if [ $? -ne 0 ]; then
            echo "❌ 构建失败，退出工作流"
            exit 1
          fi
          echo "✅ 构建成功"

      - name: 🏷️ 获取包信息
        id: package-info
        run: |
          PACKAGE_NAME=$(pnpm pkg get name | tr -d '"')
          PACKAGE_SHORT_NAME=$(basename "$PACKAGE_NAME")
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "short_name=$PACKAGE_SHORT_NAME" >> $GITHUB_OUTPUT

      - name: 📊 获取 Git 信息
        id: git-info
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "short_commit_hash=$SHORT_COMMIT_HASH" >> $GITHUB_OUTPUT

      # 手动生产模式：应用版本号变更
      - name: 🎯 应用手动版本号
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production'
        run: |
          npm version ${{ inputs.manual_version }} --no-git-tag-version
          echo "✅ 已应用手动版本号：${{ inputs.manual_version }}"

      - name: 📦 准备发布产物 (正式版)
        if: needs.version-release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production')
        run: |
          pnpm pkg delete devDependencies
          pnpm pkg delete scripts
          mkdir -p ${{ runner.temp }}/production/
          cp -r package.json README.md CHANGELOG.md LICENSE config dist ktr/public ${{ runner.temp }}/production/

      - name: 📦 准备构建分支产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pnpm pkg delete devDependencies
          pnpm pkg delete scripts
          mkdir -p ${{ runner.temp }}/build-branch/
          cp -r package.json CHANGELOG.md README.md LICENSE config dist ktr/public ${{ runner.temp }}/build-branch/

      - name: 📦 准备预览包产物
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        run: |
          mkdir -p ${{ runner.temp }}/preview/
          cp -r package.json README.md CHANGELOG.md LICENSE config dist ktr/public ${{ runner.temp }}/preview/

      - name: 📤 上传正式版构建产物
        if: needs.version-release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production')
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: ${{ runner.temp }}/production/

      - name: 📤 上传构建分支产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: build-branch-artifacts
          path: ${{ runner.temp }}/build-branch/

      - name: 📤 上传预览包产物
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production'
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: ${{ runner.temp }}/preview/

      - name: ✅ 标记构建状态
        id: build-status
        run: echo "success=true" >> $GITHUB_OUTPUT

  # NPM 正式发布
  npm-production-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-release, unified-build]
    if: |
      needs.unified-build.outputs.build_success == 'true' && (
        needs.version-release.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production') ||
        inputs.force_npm_publish == true
      )
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: .

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: 🚀 发布到 NPM 官方源
        id: publish-to-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish --no-git-checks --provenance

          echo "name=$(npm pkg get name | tr -d '"')" >> $GITHUB_OUTPUT
          echo "version=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT

      - name: 📊 生成发布报告
        run: |
          echo "## 📦 NPM 发布成功" >> $GITHUB_STEP_SUMMARY
          echo "- **包名:** \`${{ steps.publish-to-npm.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ steps.publish-to-npm.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **模式:** ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production' && '🎯 手动生产发布' || '🤖 自动发布' }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.version-release.outputs.manual_release_notes }}" != "" ]; then
            echo "- **发布说明:** ${{ needs.version-release.outputs.manual_release_notes }}" >> $GITHUB_STEP_SUMMARY
          fi

  # GitHub Packages 发布
  github-package-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-release, unified-build]
    permissions:
      contents: read
      packages: write
    if: |
      needs.unified-build.outputs.build_success == 'true' && (
        needs.version-release.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'production') ||
        inputs.force_npm_publish == true
      )
    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: .

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'

      - name: ✏️ 修改包名 (添加 Scope)
        run: |
          # 读取原始包名
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # 构造新包名 @owner/name
          NEW_NAME="@$OWNER/$ORIGINAL_NAME"

          echo "📦 修改包名: $ORIGINAL_NAME -> $NEW_NAME"

          # 修改 package.json
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.name = '$NEW_NAME';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com/' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: 🚀 发布到 GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 生成发布报告
        run: |
          echo "## 📦 GitHub Packages 发布成功" >> $GITHUB_STEP_SUMMARY
          PKG_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "- **包名:** \`$PKG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 安装配置" >> $GITHUB_STEP_SUMMARY
          echo "在 \`.npmrc\` 中添加：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`ini" >> $GITHUB_STEP_SUMMARY
          echo "@${{ github.repository_owner }}:registry=https://npm.pkg.github.com" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "然后运行：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install $PKG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # 镜像源同步
  npm-mirror-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [npm-production-publish]
    steps:
      - name: 🔄 同步到国内镜像源
        run: |
          curl --max-time 60 --connect-timeout 10 -X PUT "https://registry-direct.npmmirror.com/-/package/karin-plugin-qbot/syncs"

  # 构建分支同步
  build-branch-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unified-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.unified-build.outputs.build_success == 'true'
    outputs:
      build_completed: ${{ steps.build-success.outputs.completed }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: build-branch-artifacts
          path: ${{ runner.temp }}/build-artifacts/

      - name: ✅ 标记构建完成
        id: build-success
        run: echo "completed=true" >> $GITHUB_OUTPUT

      - name: ⚙️ 配置 Git 用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 同步主分支最新代码
        run: |
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }} --ff-only

      - name: 🔍 检查构建分支状态
        id: check-branch
        run: |
          if git ls-remote --exit-code origin build; then
            echo "branch_exists=true" >> $GITHUB_ENV
          else
            echo "branch_exists=false" >> $GITHUB_ENV
          fi

      - name: 🌿 初始化构建分支
        run: |
          if [ "${{ env.branch_exists }}" = "false" ]; then
            git checkout --orphan build
            git reset --hard
            git clean -fd
            git commit --allow-empty -m "初始化编译分支"
            git push --set-upstream -f origin build
          else
            git fetch origin build
            git reset --hard
            git clean -fd
            git reset --hard origin/build
            git checkout build
          fi

      - name: 🗂️ 准备构建文件
        run: |
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} \;
          cp -rv ${{ runner.temp }}/build-artifacts/* ./

      - name: 💾 提交构建结果
        run: |
          git add .
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "No changes detected"
            exit 0
          else
            git commit -m "chore(build): 构建分支同步"
          fi

      - name: 🚀 推送到构建分支
        uses: ad-m/github-push-action@master
        with:
          branch: build
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_with_lease: true

  # 预览包发布（优先执行）
  preview-package-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unified-build, version-release]
    if: needs.unified-build.outputs.build_success == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_mode != 'production')
    outputs:
      pkg_version: ${{ steps.version-gen.outputs.version }}
      pnpm_install_cmd: ${{ steps.publish_pkg.outputs.pnpm_install_cmd }}

    steps:
      - name: 📥 检出源代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 📦 配置 PNPM 环境
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 📥 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: .

      - name: 🏷️ 生成版本标识
        id: version-gen
        run: |
          # 1) 获取最新的Git标签版本作为基准
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            # 移除v前缀并提取版本号
            LAST_TAG_VERSION=${LAST_TAG#v}
            if echo "$LAST_TAG_VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' >/dev/null; then
              BASE_VERSION="$LAST_TAG_VERSION"
            else
              BASE_VERSION="0.0.0"
            fi
          else
            BASE_VERSION="0.0.0"
          fi

          PKG_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "")

          # 3) 版本基准：以 package.json 的 version 为唯一依据。
          #    不参与 tag / release-please 推算，确保 .github 全链路跟随仓库版本；
          #    e.g. package.json = 1.0.8，预览包即为 1.0.8 派生的预发布版本（不再额外 bump）。
          if ! echo "$PKG_VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' >/dev/null; then
            # package.json 缺失/非法时退回 Git 标签版本，仍非法则兜底 0.0.0
            PKG_VERSION="$BASE_VERSION"
            echo "$PKG_VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' >/dev/null || PKG_VERSION="0.0.0"
          fi
          FINAL_BASE="$PKG_VERSION"

          echo "🏷️ 版本基准（package.json 唯一）："
          echo "  - Package版本: $PKG_VERSION"
          echo "  - 最终基准: $FINAL_BASE"

          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          TIMESTAMP=$(date +%s)

          # 5) 根据事件类型拼接预发布后缀（在 package.json 版本上直接派生，不做额外 bump）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER=${{ github.event.number }}
            PR_COMMIT_COUNT=$(git rev-list --count HEAD ^origin/main 2>/dev/null || echo 0)
            NEW_VERSION="${FINAL_BASE}-alpha.${PR_NUMBER}.${PR_COMMIT_COUNT}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TIME_SUFFIX=$(echo "$TIMESTAMP" | tail -c 5)
            NEW_VERSION="${FINAL_BASE}-beta.${COMMIT_COUNT}.${TIME_SUFFIX}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIME_SUFFIX=$(TZ='Asia/Shanghai' date +%m%d%H%M)
            NEW_VERSION="${FINAL_BASE}-manual.${TIME_SUFFIX}"
          else
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            NEW_VERSION="${FINAL_BASE}-dev.${BRANCH_NAME}.${{ needs.unified-build.outputs.short_commit_hash }}"
          fi

          echo "🎯 最终生成版本: $NEW_VERSION"
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: 🧹 清理开发依赖
        run: |
          pnpm pkg delete devDependencies
          pnpm pkg delete scripts

      - name: 🚀 发布预览包
        id: publish_pkg
        run: |
          npx --yes pkg-pr-new publish --json output.json --comment=off --compact --packageManager=pnpm 2>&1 | tee pkg-output.txt

          ACTUAL_INSTALL_URL=$(grep -oE 'https://pkg\.pr\.new/[^[:space:]`]+' pkg-output.txt | head -n 1 || echo "")

          if [ ! -z "$ACTUAL_INSTALL_URL" ]; then
            # 尝试提取短链接格式 (package@sha)
            if [[ "$ACTUAL_INSTALL_URL" =~ https://pkg\.pr\.new/[^/]+/[^/]+/([^/]+@.+) ]]; then
              ACTUAL_INSTALL_URL="https://pkg.pr.new/${BASH_REMATCH[1]}"
            fi
            PNPM_INSTALL_CMD="pnpm add ${ACTUAL_INSTALL_URL} -w"
          else
            PNPM_INSTALL_CMD="未找到安装命令"
          fi

          echo "pnpm_install_cmd=$PNPM_INSTALL_CMD" >> $GITHUB_OUTPUT

      - name: 💬 发布 PR 评论
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 📦 预览包发布成功

            ### 🏷️ 包信息
            - **版本:** `${{ steps.version-gen.outputs.version }}`
            - **提交:** [`${{ needs.unified-build.outputs.short_commit_hash }}`](https://github.com/${{ github.repository }}/tree/${{ needs.unified-build.outputs.commit_hash }})

            ### 📥 安装命令
            ```bash
            ${{ steps.publish_pkg.outputs.pnpm_install_cmd }}
            ```
          comment-tag: published-packages
          mode: upsert
          reactions: rocket

  # 预览包发布后的即时构建摘要（PR）
  pr-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unified-build, preview-package-publish]
    if: github.event_name == 'pull_request' && needs.unified-build.outputs.build_success == 'true' && needs.preview-package-publish.result == 'success'
    steps:
      - name: 📊 生成PR构建摘要
        run: |
          echo "# 🚀 PR 构建完成摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 NPM 预览包" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📥 安装命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.preview-package-publish.outputs.pnpm_install_cmd }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # 预览包发布后的即时构建摘要（仅针对main分支推送）
  main-push-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unified-build, preview-package-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.unified-build.outputs.build_success == 'true' && needs.preview-package-publish.result == 'success'
    steps:
      - name: 📊 生成main分支推送构建摘要
        run: |
          echo "# 🚀 Main分支构建完成摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # NPM 预览包信息
          echo "## 📦 NPM 预览包" >> $GITHUB_STEP_SUMMARY
          echo "- **版本:** \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 安装命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.preview-package-publish.outputs.pnpm_install_cmd }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 构建信息
          echo "## ℹ️ 构建信息" >> $GITHUB_STEP_SUMMARY
          echo "- **提交:** [\`${{ needs.unified-build.outputs.short_commit_hash }}\`](https://github.com/${{ github.repository }}/commit/${{ needs.unified-build.outputs.commit_hash }})" >> $GITHUB_STEP_SUMMARY
          echo "- **分支:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **触发:** 推送到main分支" >> $GITHUB_STEP_SUMMARY

  build-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unified-build, preview-package-publish, github-package-publish]
    if: always() && needs.unified-build.outputs.build_success == 'true'
    steps:
      - name: 📊 生成完整构建摘要
        run: |
          echo "# 🚀 完整构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # NPM 包信息
          if [ "${{ needs.preview-package-publish.result }}" = "success" ]; then
            echo "## 📦 NPM 预览包" >> $GITHUB_STEP_SUMMARY
            echo "- **版本:** \`${{ needs.preview-package-publish.outputs.pkg_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📥 安装命令" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.preview-package-publish.outputs.pnpm_install_cmd }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # GitHub Packages 信息
          if [ "${{ needs.github-package-publish.result }}" = "success" ]; then
            echo "## 📦 GitHub Packages" >> $GITHUB_STEP_SUMMARY
            echo "- **状态:** ✅ 发布成功" >> $GITHUB_STEP_SUMMARY
            echo "- **Registry:** https://npm.pkg.github.com" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi