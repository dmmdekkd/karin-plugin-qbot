name: Release and Publish # 自动发版本 + 自动构建 + 自动发布到 npm
on:
  push:
    branches:
      - main # 推送到 main 时自动触发（release-please 依据 Conventional Commits 自动计算版本号）
  workflow_dispatch: # 也支持在 Actions 页面手动触发发版
permissions:
  contents: write # 用于创建 tag / GitHub Release / 更新 CHANGELOG
  pull-requests: write
  issues: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please：自动计算版本号、更新 CHANGELOG.md 与 package.json 版本、打 tag、创建 GitHub Release
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          release-type: node
      # 仅当 release-please 确认需要发布（release_created=true）时才执行以下构建发布步骤
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v4
        with:
          # tsdown 构建要求 node >= 22.18
          node-version: 22
          registry-url: https://registry.npmjs.org
        if: ${{ steps.release.outputs.release_created }}
      # 安装根依赖
      - run: npm install
        if: ${{ steps.release.outputs.release_created }}
      # 安装 web 前端依赖（web 是独立 npm 子项目，必须单独安装后才能构建）
      - run: npm run setup:web
        if: ${{ steps.release.outputs.release_created }}
      # 编译：tsdown（后端） + vite（前端）
      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}
      # 删除开发依赖，避免发布包携带多余内容
      - run: npm pkg delete devDependencies
        if: ${{ steps.release.outputs.release_created }}
      # 发布到 npm（需要仓库配置 NPM_TOKEN secret）
      - run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}