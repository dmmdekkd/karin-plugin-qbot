name: Publish to npm # 自动构建并发布到 npm（版本号由 package.json 手动维护，本流程不写任何更新信息）
on:
  push:
    branches:
      - main
    # 只在涉及 package.json 的提交（即手动更新版本号）时触发自动发布
    paths:
      - 'package.json'
  workflow_dispatch: # 也可在 Actions 页面手动触发（如漏发补偿）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # tsdown 构建要求 node >= 22.18
          registry-url: https://registry.npmjs.org

      # 根项目是 pnpm 管理（无 package-lock.json），用 npm install 会触发
      # arborist 解析崩溃（edgesOut）且不会执行 native 构建脚本，故用 pnpm
      # 固定 pnpm@11：其 install 已不支持 --allow-build 参数，构建脚本白名单
      # 统一放在 pnpm-workspace.yaml 的 allowBuilds 中声明（含 esbuild）
      # --no-frozen-lockfile：CI 默认冻结锁文件，本仓库 lockfile: false 无锁可冻，需放行
      - name: 安装根依赖（pnpm）
        run: |
          npm install -g pnpm@11
          pnpm install --no-frozen-lockfile

      # web 前端已移除，改为 Karin WebUI 内置组件模式，构建仅需 tsdown（后端）
      - name: 构建
        run: npm run build

      # 读取 package.json 中手动维护的版本号
      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      # 校验该版本尚未发布，防止重复发布
      - name: 校验版本未发布
        run: |
          if [ -n "$(npm view $(node -p 'require(\"./package.json\").name')@${{ steps.ver.outputs.version }} version 2>/dev/null)" ]; then
            echo "::error::版本 v${{ steps.ver.outputs.version }} 已发布到 npm，请先在 package.json 手动更新版本号后重新推送"
            exit 1
          fi

      # 删除开发依赖，避免发布包携带多余内容（仅改动 CI 工作区，不入库）
      - name: 清理开发依赖
        run: npm pkg delete devDependencies

      # 发布到 npm（需要仓库配置 NPM_TOKEN secret）
      - name: 发布到 npm
        run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 从 CHANGELOG.md 中提取当前版本条目（## 版本 到下一个 ## 之间）作为 Release 正文
      - name: 提取更新日志
        id: changelog
        run: |
          {
            echo "body<<EOF"
            awk -v v="${{ steps.ver.outputs.version }}" '
              $0 == ("## " v) { found = 1; next }
              found == 1 && $0 ~ /^## / { exit }
              found == 1 { print }
            ' CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 创建 GitHub Release（npm 发布成功后自动打 vX.Y.Z tag；正文优先取 CHANGELOG，缺失时回退自动生成）
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            ${{ steps.changelog.outputs.body }}
          generate_release_notes: true