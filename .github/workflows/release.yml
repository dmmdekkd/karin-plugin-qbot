name: Publish to npm # 自动构建并发布到 npm（版本号由 package.json 手动维护，本流程不写任何更新信息）
on:
  push:
    branches:
      - main
    # 只在涉及 package.json 的提交（即手动更新版本号）时触发自动发布
    paths:
      - 'package.json'
  workflow_dispatch: # 也可在 Actions 页面手动触发（如漏发补偿）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # tsdown 构建要求 node >= 22.18
          registry-url: https://registry.npmjs.org

      # 根项目是 pnpm 管理（无 package-lock.json），用 npm install 会触发
      # arborist 解析崩溃（edgesOut）且不会执行 native 构建脚本，故用 pnpm
      # --no-frozen-lockfile：CI 默认冻结锁文件且在无锁文件时报错，这里允许无锁安装
      # --allow-build=esbuild：允许 esbuild 的 postinstall 脚本下载平台二进制
      - name: 安装根依赖（pnpm）
        run: |
          npm install -g pnpm
          pnpm install --allow-build=esbuild --no-frozen-lockfile

      # web 是独立 npm 子项目（web/package-lock.json 存在），继续用 npm
      - name: 安装 web 依赖
        run: npm run setup:web

      # 编译：tsdown（后端） + vite（前端）
      - name: 构建
        run: npm run build

      # 读取 package.json 中手动维护的版本号
      - name: 读取版本号
        id: ver
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      # 校验该版本尚未发布，防止重复发布
      - name: 校验版本未发布
        run: |
          if [ -n "$(npm view $(node -p 'require(\"./package.json\").name')@${{ steps.ver.outputs.version }} version 2>/dev/null)" ]; then
            echo "::error::版本 v${{ steps.ver.outputs.version }} 已发布到 npm，请先在 package.json 手动更新版本号后重新推送"
            exit 1
          fi

      # 删除开发依赖，避免发布包携带多余内容（仅改动 CI 工作区，不入库）
      - name: 清理开发依赖
        run: npm pkg delete devDependencies

      # 发布到 npm（需要仓库配置 NPM_TOKEN secret）
      - name: 发布到 npm
        run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}